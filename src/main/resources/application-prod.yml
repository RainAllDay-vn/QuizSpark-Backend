spring:
  datasource:
    url: jdbc:h2:file:/data/quizspark_db
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    # This line tells Hibernate how to handle schema changes
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true