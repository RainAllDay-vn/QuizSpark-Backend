spring.application.name=QuizSpark Server
spring.profiles.active=test
spring.security.user.name=admin
spring.security.user.password=admin123
spring.h2.console.settings.web-allow-others=true

FIREBASE_JSON_PATH=backend-private-key.json

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Spring AI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.base-url=${OPENAI_BASE_URL}

# Ollama Configuration
spring.ai.ollama.embedding.enabled=true
spring.ai.ollama.embedding.options.model=nomic-embed-text

# Disable OpenAI Embedding to avoid conflict
spring.ai.openai.embedding.enabled=false

# Qdrant Configuration
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=quizspark
spring.ai.vectorstore.qdrant.initialize-schema=true